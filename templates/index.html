
<!DOCTYPE html>

<html lang="en">
    
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>KT RAG Assistant</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f7fb;

            color: #222;

        }


        /* ==============================
           MAIN CONTAINER
           ============================== */

        .container {

            width: 90%;

            max-width: 900px;

            margin: 50px auto;

        }


        /* ==============================
           HEADER
           ============================== */

        .header {

            background: #1f4e79;

            color: white;

            padding: 40px 25px;

            text-align: center;

            border-radius: 15px 15px 0 0;

        }


        .header h1 {

            margin: 0;

            font-size: 38px;

        }


        .header p {

            margin-top: 12px;

            font-size: 18px;

        }


        /* ==============================
           CHAT AREA
           ============================== */

        .chat {

            background: white;

            padding: 35px;

            border-radius: 0 0 15px 15px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.10);

        }


        .chat h2 {

            color: #1f4e79;

            margin-top: 0;

        }


        /* ==============================
           TEXT AREA
           ============================== */

        textarea {

            width: 100%;

            height: 140px;

            padding: 15px;

            font-size: 17px;

            border: 1px solid #ccc;

            border-radius: 10px;

            resize: vertical;

            outline: none;

        }


        textarea:focus {

            border-color: #1f4e79;

        }


        /* ==============================
           BUTTON
           ============================== */

        button {

            width: 100%;

            margin-top: 18px;

            padding: 16px;

            border: none;

            border-radius: 10px;

            background: #1f4e79;

            color: white;

            font-size: 18px;

            cursor: pointer;

        }


        button:hover {

            background: #163a5c;

        }


        button:disabled {

            background: #888;

            cursor: not-allowed;

        }


        /* ==============================
           ANSWER
           ============================== */

        .answer-title {

            margin-top: 30px;

            color: #1f4e79;

        }


        #answer {

            margin-top: 15px;

            padding: 22px;

            background: #f1f5f9;

            border-radius: 10px;

            line-height: 1.7;

            font-size: 17px;

            white-space: pre-wrap;

            min-height: 100px;

        }


        /* ==============================
           FOOTER
           ============================== */

        .footer {

            text-align: center;

            color: #777;

            padding: 20px;

            font-size: 14px;

        }


        /* ==============================
           MOBILE
           ============================== */

        @media (max-width: 600px) {

            .container {

                width: 94%;

                margin: 20px auto;

            }


            .header h1 {

                font-size: 28px;

            }


            .header p {

                font-size: 16px;

            }


            .chat {

                padding: 25px;

            }


            textarea {

                height: 120px;

            }

        }

    </style>

</head>


<body>


    <!-- =================================
         MAIN CONTAINER
         ================================= -->

    <div class="container">


        <!-- HEADER -->

        <div class="header">

            <h1>
                🤖 KT RAG Assistant
            </h1>

            <p>
                Knowledge Transfer Question Answering System
            </p>

        </div>


        <!-- CHAT -->

        <div class="chat">


            <h2>
                Ask a Question
            </h2>


            <textarea
                id="question"
                placeholder="Ask a question about your knowledge base..."
            ></textarea>


            <button
                id="askButton"
                onclick="askQuestion()"
            >
                Ask Question
            </button>


            <h2 class="answer-title">
                Answer
            </h2>


            <div id="answer">

                Your answer will appear here.

            </div>


        </div>


        <!-- FOOTER -->

        <div class="footer">

            KT RAG Assistant | RAG Assignment

        </div>


    </div>


    <!-- =================================
         JAVASCRIPT
         ================================= -->

    <script>


        async function askQuestion() {


            const questionBox =
                document.getElementById(
                    "question"
                );


            const answerBox =
                document.getElementById(
                    "answer"
                );


            const askButton =
                document.getElementById(
                    "askButton"
                );


            const question =
                questionBox.value.trim();


            /* -----------------------------
               CHECK EMPTY QUESTION
               ----------------------------- */

            if (!question) {

                answerBox.innerText =
                    "Please enter a question.";

                return;

            }


            /* -----------------------------
               SHOW LOADING
               ----------------------------- */

            answerBox.innerText =
                "🔎 Searching knowledge base...";


            askButton.disabled = true;


            askButton.innerText =
                "Searching...";


            try {


                /* -------------------------
                   SEND QUESTION TO FLASK
                   ------------------------- */

                const response =
                    await fetch(
                        "/ask",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    question:
                                        question

                                })

                        }
                    );


                /* -------------------------
                   GET RESPONSE
                   ------------------------- */

                const data =
                    await response.json();


                /* -------------------------
                   DISPLAY ANSWER
                   ------------------------- */

                if (data.answer) {

                    answerBox.innerText =
                        data.answer;

                }

                else if (data.error) {

                    answerBox.innerText =
                        "❌ " + data.error;

                }

                else {

                    answerBox.innerText =
                        "❌ No answer received.";

                }


            }


            catch (error) {


                console.error(
                    "Error:",
                    error
                );


                answerBox.innerText =
                    "❌ Error connecting to the server.";

            }


            finally {


                askButton.disabled =
                    false;


                askButton.innerText =
                    "Ask Question";

            }

        }


    </script>


</body>

</html>
